<title>Interagent Gap Index</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: one narrow column of numbered sections (§), each a short declarative headline,
   one figure, one caption. Two bits of ink on paper; tiers are fill patterns, not colours;
   red is spent on one thing only: the gap (a risk or instance nothing backs). */
:root {
  --paper: #fcfcfa; --ink: #111110; --ink-2: #5c5c58; --rule: #d8d8d2; --tone: #9a9a94;
  --gap: #c8231b;
  /* one flat light grey for every in-between state: synthetic, partially verified, mid counts */
  --wash: #e4e4de;
  --hatch: var(--wash);
  --hatch-soft: var(--wash);
  --sans: "IBM Plex Sans", "Helvetica Neue", Arial, sans-serif;
  --mono: "IBM Plex Mono", Menlo, "DejaVu Sans Mono", monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #121211; --ink: #ecebe6; --ink-2: #a3a29c; --rule: #2e2e2b; --tone: #5d5d58; --gap: #ff5a4c; --wash: #3a3a36; color-scheme: dark; } }
:root[data-theme="dark"] { --paper: #121211; --ink: #ecebe6; --ink-2: #a3a29c; --rule: #2e2e2b; --tone: #5d5d58; --gap: #ff5a4c; --wash: #3a3a36; color-scheme: dark; }

* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font: 15px/1.55 var(--sans); }
.wrap { max-width: 880px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 0 72px; }
.mono, code { font-family: var(--mono); }
.lab { font: 500 11px/1.3 var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }

/* the xerox strip */
.bar { position: sticky; isolation: isolate; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--paper); border-bottom: 1px solid var(--ink); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.bar .wrap { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: flex-start; gap: 6px 22px; padding-block: 9px; }
.bar b { font: 600 12px var(--mono); letter-spacing: .1em; text-transform: uppercase; }
.bar b .ver { font-weight: 400; color: var(--ink-2); margin-left: 6px; }
.bar nav { display: flex; flex-wrap: wrap; gap: 4px 14px; justify-content: flex-start; }
.bar a { color: var(--ink-2); text-decoration: none; font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; }
.bar a:hover, .bar a:focus-visible { color: var(--ink); text-decoration: underline; }
.proposal { border: 1px dashed var(--ink-2); padding: 8px 12px; margin-top: 24px; font-size: 13px; color: var(--ink-2); }

header.hero { padding-block: 48px 0; }
.intro { display: grid; gap: 12px; max-width: 64ch; }
.intro p { margin: 0; }
.intro b { font-weight: 600; }
a { color: inherit; text-underline-offset: 3px; text-decoration-thickness: 1px; }
a:hover { text-decoration-thickness: 2px; }
.srcfig { margin-top: 32px; }
.srcs { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 64px; gap: 0 14px; align-items: center; }
.srcs > * { padding-block: 7px; border-top: 1px solid var(--rule); }
.srcs .track { display: flex; gap: 0; height: 26px; align-items: center; }
.srcs .track i { display: block; height: 12px; }
.srcs .n { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.srcs .n small { color: var(--ink-2); font-weight: 400; }
.results { padding-top: 48px; }
.figs .sub { font-size: 12px; color: var(--ink-2); }
.fmcols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
.fmcol { border: 1px solid var(--ink); padding: 12px; display: grid; gap: 8px; align-content: start; min-width: 0; }
.fmcol h3 { margin: 0; font: 500 15px var(--sans); display: flex; justify-content: space-between; gap: 8px; }
.fmcol h3 .mono { font-size: 13px; }
.fmcol ul { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 13px; }
.fmcol li { display: grid; grid-template-columns: 12px minmax(0, 1fr); gap: 8px; align-items: baseline; }
.fmcol li .mono { font-size: 11px; color: var(--ink-2); display: block; }
.undet { margin-top: 14px; border: 1px dashed var(--ink-2); padding: 10px 12px; font-size: 13px; color: var(--ink-2); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.undet b { font: 500 20px var(--mono); color: var(--ink); }
@media (max-width: 700px) { .fmcols { grid-template-columns: 1fr; } .srcs { grid-template-columns: 1fr 56px; } .srcs .track { grid-column: 1 / -1; border-top: 0; padding-top: 0; } }
.chart { overflow-x: auto; }
.chart svg { min-width: 560px; }
svg .mark { stroke: var(--gap); stroke-dasharray: 3 3; stroke-width: 1.2; }
svg .marktx { fill: var(--gap); }
h1 { font: 500 clamp(32px, 6vw, 52px)/1.08 var(--sans); letter-spacing: -.02em; margin: 14px 0 16px; text-wrap: balance; }
.lede { max-width: 60ch; color: var(--ink-2); margin: 0; }
.figs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--rule); margin-top: 36px; }
.figs > div { padding: 14px 14px 14px 0; display: grid; gap: 4px; }
.figs > div + div { padding-left: 14px; border-left: 1px solid var(--rule); }
.figs .v { font: 500 30px/1 var(--mono); font-variant-numeric: tabular-nums; }
.figs .v small { font-size: 15px; color: var(--ink-2); }
.figs .gap .v { color: var(--gap); }
@media (max-width: 620px) { .figs { grid-template-columns: 1fr 1fr; } .figs > div:nth-child(3) { padding-left: 0; border-left: 0; } .figs > div:nth-child(n+3) { border-top: 1px solid var(--rule); } }

section { padding-top: 64px; scroll-margin-top: 56px; }
/* each report section folds: the § label and headline are the toggle */
.fold > summary { list-style: none; cursor: pointer; }
.fold > summary::-webkit-details-marker { display: none; }
.fold > summary .lab { display: flex; gap: 10px; align-items: center; }
.fold > summary .lab::before { content: "−"; font: 500 14px var(--mono); width: 12px; color: var(--ink); }
.fold:not([open]) > summary .lab::before { content: "+"; }
.fold > summary .lab::after { content: ""; flex: 1; border-top: 1px solid var(--rule); }
.fold > summary:hover .lab, .fold > summary:hover h2 { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; }
.fold > summary:focus-visible { outline: 2px dotted var(--ink); outline-offset: 4px; }
.fold:not([open]) > summary h2 { color: var(--ink-2); }
.fold > summary h2 { margin-bottom: 8px; }
.results .figs { margin-top: 12px; }
h2 { font: 500 26px/1.2 var(--sans); letter-spacing: -.01em; margin: 12px 0 8px; text-wrap: balance; }
.note { max-width: 62ch; color: var(--ink-2); margin: 0 0 22px; font-size: 14px; }
.cap { font: 11px/1.45 var(--mono); color: var(--ink-2); margin-top: 12px; max-width: 70ch; }
.cap b { color: var(--ink); font-weight: 500; }

/* tier fills: solid / halftone / outline. Same three marks everywhere. */
.t-real_world { background: var(--ink); }
.t-synthetic { background: var(--hatch); box-shadow: inset 0 0 0 1px var(--ink); }
.t-lab { box-shadow: inset 0 0 0 1px var(--ink); }
.key { display: flex; flex-wrap: wrap; gap: 6px 18px; margin-bottom: 16px; font-size: 13px; }
.key span { display: inline-flex; align-items: center; gap: 7px; }
.sw { width: 14px; height: 10px; display: inline-block; }

/* §1 risks */
.risks { display: grid; grid-template-columns: minmax(0, 220px) minmax(0, 1fr) 36px; gap: 0 14px; align-items: center; }
.risks .grp { grid-column: 1 / -1; padding: 14px 0 6px; }
.risks .nm { padding-block: 7px; border-top: 1px solid var(--rule); font-size: 14px; display: flex; gap: 8px; min-width: 0; }
.risks .nm .mono { color: var(--ink-2); font-size: 12px; padding-top: 1px; width: 30px; flex: none; }
.risks .track { height: 12px; display: flex; gap: 1px; }
.risks .track i { display: block; height: 100%; }
.risks .n { font: 500 13px var(--mono); text-align: right; font-variant-numeric: tabular-nums; }
.risks .none { font: 11px var(--mono); color: var(--gap); letter-spacing: .08em; text-transform: uppercase; }
.risks .n.z { color: var(--gap); }

/* §2 matrix */
.mx-wrap { overflow-x: auto; }
table.mx { border-collapse: collapse; font-size: 14px; }
.mx th, .mx td { padding: 7px 14px 7px 0; border-top: 1px solid var(--rule); text-align: left; font-weight: 400; }
.mx thead th { border-top: 0; vertical-align: bottom; }
.mx td.c { text-align: center; padding-right: 0; width: 72px; }
.mx td.c span { display: inline-block; width: 12px; height: 12px; }
.mx .prose { background: var(--ink); }
.mx .cotag { box-shadow: inset 0 0 0 1.5px var(--ink); }
.mx .cnt { font: 12px var(--mono); color: var(--ink-2); text-align: right; padding-left: 14px; }

/* §3 time */
svg text { fill: var(--ink-2); font: 11px var(--mono); }
svg .ax { stroke: var(--rule); }
svg .ln { stroke: var(--ink); fill: none; stroke-width: 1.5; }
svg .ar { fill: var(--ink); opacity: .07; }

/* §4 instances */
.ig { display: grid; gap: 18px; }
.box { border: 1px solid var(--ink); padding: 14px; display: grid; gap: 16px; }
.box > .lab { color: var(--ink); }
.cell .bar-in { height: 3px; background: var(--ink); margin-top: 4px; }
.ig .row { display: grid; grid-template-columns: 190px minmax(0, 1fr); gap: 14px; align-items: start; }
.ig .cells { display: flex; flex-wrap: wrap; gap: 6px; }
.cell { width: 104px; min-height: 58px; padding: 6px 7px; border: 1px solid var(--ink); display: grid; align-content: space-between; font-size: 12px; line-height: 1.25; }
.cell .top { display: flex; justify-content: space-between; font: 11px var(--mono); }
.cell .top b { font-weight: 500; }
.cell.z { border: 1px dashed var(--gap); color: var(--ink-2); }
.cell.z .top b { color: var(--gap); }
.cell .ours { font: 10px var(--mono); letter-spacing: .08em; }
@media (max-width: 620px) { .ig .row, .risks { grid-template-columns: 1fr; } .risks .n { text-align: left; } .risks .track { margin-bottom: 4px; } }

/* §2 instance x failure-mode matrix */
.mxw { overflow-x: auto; }
table.mx2 { border-collapse: collapse; width: 100%; min-width: 560px; font-size: 13.5px; }
.mx2 th, .mx2 td { padding: 5px 8px; text-align: left; font-weight: 400; }
.mx2 thead th { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); vertical-align: bottom; border-bottom: 1px solid var(--ink); }
.mx2 thead th.num, .mx2 td.num { text-align: center; width: 64px; }
.mx2 tbody.fam th[colspan] { font: 500 11px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink); padding-top: 18px; }
.mx2 tbody.fam { border: 1px solid var(--ink); }
.mx2 tr.risk th { font-size: 13px; padding-top: 10px; color: var(--ink-2); border-top: 1px solid var(--rule); }
.mx2 td.id { font: 12px var(--mono); color: var(--ink-2); width: 44px; padding-left: 14px; }
.mx2 td.num { font: 500 12px var(--mono); font-variant-numeric: tabular-nums; }
.mx2 td.num span { display: inline-block; min-width: 26px; padding: 2px 0; }
.mx2 td.num .d1 { box-shadow: inset 0 0 0 1px var(--ink); }
.mx2 td.num .d2 { background: var(--hatch-soft); box-shadow: inset 0 0 0 1px var(--ink); }
.mx2 td.num .d3 { background: var(--ink); color: var(--paper); }
.mx2 td.num.zero { color: var(--rule); }
.mx2 td.tot { border-left: 1px solid var(--rule); }
.mx2 tr.z td.nm { color: var(--ink-2); }
.mx2 tr.z td.tot span { color: var(--gap); }
.mx2 .ours { font: 10px var(--mono); letter-spacing: .08em; color: var(--ink-2); margin-left: 6px; }


/* table: sort buttons and the filter row */
.inc button.sort { all: unset; cursor: pointer; font: inherit; letter-spacing: inherit; text-transform: inherit; color: var(--ink-2); white-space: nowrap; }
.inc button.sort:hover, .inc button.sort.on { color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
.inc button.sort:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }
.inc tr.fr th { padding-top: 0; padding-bottom: 8px; }
.inc tr.fr input, .inc tr.fr select { width: 100%; min-width: 0; font: 11px var(--mono); color: var(--ink); background: var(--paper);
  border: 1px solid var(--rule); border-radius: 3px; padding: 3px 5px; text-transform: none; letter-spacing: 0; }
.inc tr.fr input:focus, .inc tr.fr select:focus { border-color: var(--ink); outline: none; }
.inc tr.fr th:nth-child(2) input { max-width: 260px; }

/* §5 method flowchart. Actor is the encoding: script outline, model dashed, rule grey, person ink. */
.flow { margin: 8px 0 0; overflow-x: auto; }
.flow svg.fc { display: block; width: 100%; max-width: 640px; min-width: 520px; height: auto; }
.fc text { font-family: var(--sans); }
.fc .fc-t { font-size: 13px; font-weight: 500; fill: var(--ink); }
.fc .fc-s { font-size: 11px; fill: var(--ink-2); }
.fc .fc-el { font: 10.5px var(--mono); fill: var(--ink-2); }
.fc .fc-lg { font-size: 12px; fill: var(--ink-2); }
.fc .fc-ph { font: 500 10.5px var(--mono); letter-spacing: .12em; fill: var(--ink-2); }
.fc .fc-band { stroke: var(--rule); stroke-width: 1; }
.fc rect { stroke: var(--ink); stroke-width: 1; fill: var(--paper); }
.fc .fc-model rect { stroke-dasharray: 4 3; }
.fc .fc-rule rect { fill: var(--wash); }
.fc .fc-person rect { fill: var(--ink); }
.fc .fc-person .fc-t { fill: var(--paper); }
.fc .fc-person .fc-s { fill: var(--paper); opacity: .78; }
.fc .fc-out rect { stroke: var(--tone); stroke-dasharray: 2 3; fill: var(--paper); }
.fc .fc-out .fc-t { fill: var(--ink-2); font-weight: 400; }
.fc .fc-e { stroke: var(--ink); stroke-width: 1.2; fill: none; }
.fc .fc-x { stroke: var(--tone); stroke-width: 1.2; fill: none; stroke-dasharray: 3 3; }
.fc .fc-ah { fill: var(--ink); }
.fc .fc-ahx { fill: var(--tone); }

/* the data dictionary: each group folds on its own */
.subs { display: grid; border-top: 1px solid var(--ink); }
.sub { border-bottom: 1px solid var(--rule); }
.sub summary { list-style: none; cursor: pointer; display: flex; align-items: baseline; gap: 10px; padding: 10px 0; }
.sub summary::-webkit-details-marker { display: none; }
.sub summary::before { content: "+"; font: 500 14px var(--mono); width: 12px; color: var(--ink-2); }
.sub[open] summary::before { content: "−"; }
.sub summary .lab { color: var(--ink); }
.sub summary .cnt { font: 11px var(--mono); color: var(--ink-2); margin-left: auto; }
.sub summary:hover .lab { text-decoration: underline; text-underline-offset: 3px; }
.sub summary:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }
.sub .defs { padding: 2px 0 16px 22px; }

/* clickable things and the active selection */
.hit { cursor: pointer; text-decoration: underline dotted var(--tone); text-underline-offset: 3px; border-radius: 2px; }
.hit:hover { text-decoration: underline solid var(--ink); }
.hit:focus-visible, [data-f]:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }
.hit.sel { background: var(--ink); color: var(--paper); text-decoration: none; padding: 0 3px; }
.hit.quiet { color: var(--ink-2); }
.keyitem { display: inline-flex; align-items: center; gap: 7px; text-decoration: none; padding: 1px 4px; }
.track i[data-f] { cursor: pointer; }
.track i[data-f]:hover { outline: 1px solid var(--ink); outline-offset: 1px; }
.track i.sel { outline: 2px solid var(--gap); outline-offset: 1px; }
.ext { text-decoration: none; color: var(--ink-2); font-size: 12px; }
.mx2 td.num .hit { text-decoration: none; display: inline-block; min-width: 26px; padding: 2px 0; }
.mx2 td.num .hit:hover { outline: 1px solid var(--ink); }
.mx2 td.num .hit.sel { outline: 2px solid var(--gap); background: var(--ink); color: var(--paper); padding: 2px 0; }
svg .band rect { fill: var(--ink); fill-opacity: 0; }
svg .band[data-f] { cursor: pointer; }
svg .band[data-f]:hover rect { fill-opacity: .06; }
svg .band.sel rect { fill-opacity: .12; }
svg .band.sel text { fill: var(--ink); font-weight: 500; }
.tblstate { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; margin: 0 0 10px; }
.inc td.empty { color: var(--ink-2); padding-block: 18px; }

/* the floating filter panel, a window in the xerox sense */
.panel { position: fixed; z-index: 20; right: max(32px, env(safe-area-inset-right, 0px)); bottom: calc(32px + env(safe-area-inset-bottom, 0px));
  width: 320px; height: 440px; max-width: calc(100vw - 32px); max-height: calc(100vh - 120px);
  background: var(--paper); border: 1px solid var(--ink); border-radius: 6px; box-shadow: 3px 3px 0 var(--ink);
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; font-size: 13px; }
.panel .p-body { overflow-y: auto; padding: 10px 12px; display: grid; gap: 10px; align-content: start; }
.panel .p-head { padding: 8px 12px 6px; }
.panel .p-act { padding: 8px 12px 10px; border-top: 1px solid var(--rule); }
.panel .p-btns { display: flex; gap: 4px; }
.panel .p-head { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--ink); padding-bottom: 6px; }
.panel .x { border: 1px solid var(--ink); background: var(--paper); color: var(--ink); width: 22px; height: 22px; line-height: 1; cursor: pointer; border-radius: 3px; }
.panel .x:hover { background: var(--ink); color: var(--paper); }
.panel .p-part b { font-weight: 600; }
.panel .p-part p { margin: 3px 0 0; color: var(--ink-2); font-size: 12.5px; line-height: 1.45; }
.panel .p-and { font: 10px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.panel .p-count { font-size: 12px; color: var(--ink-2); }
.panel .p-count .v { font: 500 24px var(--mono); color: var(--ink); margin-right: 4px; }
.panel .p-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 12.5px; }
.panel .p-list .mono { font-size: 11px; color: var(--ink-2); margin-right: 4px; }
.panel .p-list .more { color: var(--ink-2); }
.panel .p-act { display: flex; gap: 6px; }
.panel .p-act .chip { text-decoration: none; }
@media (max-width: 700px) { .panel { right: 16px; left: 16px; width: auto; height: 380px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); } }
/* wide screens: park the window in the right margin, well clear of the 880px column */
@media (min-width: 1640px) { .panel { right: auto; left: calc(50% + 440px + 64px); bottom: auto; top: calc(88px + env(safe-area-inset-top, 0px)); } }
.barfilter { position: absolute; top: 50%; transform: translateY(-50%); right: max(32px, env(safe-area-inset-right, 0px)); width: 320px;
  display: flex; align-items: stretch; background: var(--paper); border: 1px solid var(--ink); border-radius: 6px; box-shadow: 2px 2px 0 var(--ink); font: 11px var(--mono); }
/* keep the bar's own text clear of the docked chip */
body.docked .bar .wrap { padding-right: max(16px, calc(808px - 50vw)); }
@media (min-width: 1640px) { .barfilter { right: auto; left: calc(50% + 440px + 64px); } body.docked .bar .wrap { padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
@media (max-width: 700px) { .barfilter { position: static; transform: none; width: 100%; } body.docked .bar .wrap { padding-right: max(16px, env(safe-area-inset-right, 0px)); } }
.barfilter[hidden] { display: none !important; }
.barfilter button { background: var(--paper); color: var(--ink); border: 0; font: inherit; cursor: pointer; padding: 3px 8px; }
.barfilter button:hover { background: var(--ink); color: var(--paper); }
.barfilter .bf-open { flex: 1; min-width: 0; text-align: left; padding: 5px 10px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; letter-spacing: .04em; }
.barfilter .bf-open b { font-weight: 500; }
.barfilter .bf-x { border-left: 1px solid var(--ink); }
@media (prefers-reduced-motion: no-preference) { .barfilter.flash { animation: flash .6s ease-out; } @keyframes flash { from { background: var(--ink); } to { background: transparent; } } }

/* §5 incidents */
.filters { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
.chip { font: 11px var(--mono); letter-spacing: .08em; text-transform: uppercase; background: var(--paper); color: var(--ink); border: 1px solid var(--ink); border-radius: 3px; padding: 4px 9px; cursor: pointer; }
.chip[aria-pressed="true"], .chip:hover { background: var(--ink); color: var(--paper); }
.chip:focus-visible { outline: 2px dotted var(--ink); outline-offset: 2px; }
.tbl-wrap { overflow-x: auto; border-top: 1px solid var(--ink); }
table.inc { width: 100%; border-collapse: collapse; font-size: 13.5px; min-width: 760px; }
.inc abbr { text-decoration: underline dotted; text-underline-offset: 3px; cursor: help; }
.inc td.m abbr + abbr { margin-left: 6px; }
.inc th { font: 500 10.5px var(--mono); letter-spacing: .1em; text-transform: uppercase; color: var(--ink-2); text-align: left; padding: 8px 10px 8px 0; }
